
<!DOCTYPE html>
<html>
<head>
    <title>Bus ETA Estimator</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #eef2f7;
            padding: 50px;
        }
        .box {
            background: white;
            padding: 25px;
            max-width: 350px;
            margin: auto;
            border-radius: 10px;
        }
        input, button {
            width: 90%;
            padding: 10px;
            margin: 8px;
        }
        button {
            background: #1769aa;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>City Bus ETA Estimator</h2>

    <input type="number" id="distance" placeholder="Distance (km)" min="0">
    <input type="number" id="speed" placeholder="Speed (km/h)" min="0">
    <input type="number" id="delay" placeholder="Traffic delay (minutes)" min="0">

    <button onclick="calculateETA()">Calculate ETA</button>

    <h3 id="result"></h3>
</div>

<script>
function calculateETA() {
    let d = document.getElementById("distance").value;
    let s = document.getElementById("speed").value;
    let t = document.getElementById("delay").value || 0;
    let result = document.getElementById("result");

    d = Number(d);
    s = Number(s);
    t = Number(t);

    if (document.getElementById("distance").value === "" ||
        document.getElementById("speed").value === "" ||
        d < 0 || s <= 0 || t < 0 ||
        !Number.isFinite(d) || !Number.isFinite(s) ||
        !Number.isFinite(t)) {
        result.innerText = "Please enter valid values!";
        return;
    }

    let eta = Math.ceil((d / s) * 60 + t);
    result.innerText = "Estimated Arrival Time: " + eta + " minutes";
}
</script>

</body>
</html>
